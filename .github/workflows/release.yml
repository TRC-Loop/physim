name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(poetry version -s)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' (version '$TAG_VERSION') does not match pyproject.toml version '$PKG_VERSION'."
            echo "::error::Bump the 'version' field in pyproject.toml to match before tagging/releasing."
            exit 1
          fi

      - name: Build wheel + sdist
        run: poetry build

      - name: Upload build artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # sibling packages version independently, so they only publish when their own
  # version is not already on pypi
  siblings:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        package: [physim-presets, physim-examples]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Check whether this version is already published
        id: check
        working-directory: packages/${{ matrix.package }}
        run: |
          VERSION="$(poetry version -s)"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/${{ matrix.package }}/$VERSION/json")"
          if [ "$CODE" = "200" ]; then
            echo "already published, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build wheel + sdist
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/${{ matrix.package }}
        run: poetry build

      - name: Upload build artifacts to GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            packages/${{ matrix.package }}/dist/* --clobber

      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/${{ matrix.package }}/dist/
