[project]
name = "physim-examples"
version = "0.1.0"
description = "Runnable example scenes for physim"
authors = [
    { name = "Arne K.", email = "me@arne.sh" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["physim", "examples", "animation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = ["physim>=0.0.0"]

[project.urls]
Homepage = "https://github.com/TRC-Loop/physim"
Repository = "https://github.com/TRC-Loop/physim"
Issues = "https://github.com/TRC-Loop/physim/issues"

[tool.poetry]
packages = [{ include = "physim_examples" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
