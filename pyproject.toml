[project]
name = "physim"
version = "0.1.0"
description = "Python library to create mp4 animated visualizations (like those social media ball videos)"
authors = [
    { name = "Arne K.", email = "me@arne.sh" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["physics", "simulation", "animation", "mp4", "video", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "skia-python>=87.0",
    "av>=11.0",
    "coloraide>=2.0",
    "alive-progress>=3.1",
    "yaspin>=3.0",
]

[project.optional-dependencies]
# the physim command-line interface
cli = ["typer>=0.12", "rich>=13.0"]
# runnable example scenes
examples = ["physim-examples>=0.0.0"]
# shapes defined by math expressions
expr = ["sympy>=1.12"]
# live preview window with audio
preview = ["opencv-python>=4.8", "sounddevice>=0.4"]
# melodies from midi files
# tones, melodies, samples and midi files
audio = ["mido>=1.3"]
# color palettes and physics presets
presets = ["physim-presets>=0.0.0"]
# offscreen gl context for gpu rasterization
gpu = ["glfw>=2.6"]
all = [
    "typer>=0.12",
    "rich>=13.0",
    "sympy>=1.12",
    "opencv-python>=4.8",
    "sounddevice>=0.4",
    "mido>=1.3",
    "physim-presets>=0.0.0",
    "physim-examples>=0.0.0",
    "glfw>=2.6",
]

[project.scripts]
physim = "physim.cli:main"

[project.urls]
Homepage = "https://github.com/TRC-Loop/physim"
Repository = "https://github.com/TRC-Loop/physim"
Issues = "https://github.com/TRC-Loop/physim/issues"

[tool.poetry]
packages = [{ include = "physim" }]

# resolve the sibling package from the repo during development; the published
# metadata still points at physim-presets on pypi
[tool.poetry.dependencies]
physim-presets = { path = "packages/physim-presets", develop = true, optional = true }
physim-examples = { path = "packages/physim-examples", develop = true, optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^7.0"
ruff = "^0.9"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # isinstance((X, Y)) is faster than X | Y at runtime, and the rule is deprecated
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
# typer declares options as call defaults; that is the framework's whole api
"physim/cli/app.py" = ["B008"]
# Vec2 is frozen, so it is safe as a default
"physim/render/paint.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["physim"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
